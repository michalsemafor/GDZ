name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unpack signs ZIP archive if present
        run: |
          mkdir -p public/signs
          for zipfile in znacky.zip signs.zip public/znacky.zip public/signs.zip public/signs/znacky.zip public/signs/signs.zip; do
            if [ -f "$zipfile" ]; then
              echo "Rozbalujem archív $zipfile do public/signs/..."
              unzip -o -j "$zipfile" "*.svg" -d public/signs/ || unzip -o "$zipfile" -d public/signs/
            fi
          done

      - name: Sync signs data
        run: npm run sync-data

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
